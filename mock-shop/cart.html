<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - ShopLite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"><div class="bar">
    <a class="logo" href="index.html">ShopLite</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="login.html">Login</a></li>
    </ul></nav>
  </div></header>
  <main>
    <h1>Your cart</h1>
    <p id="cart-empty" class="muted" hidden>Your cart is empty. <a href="products.html">Browse products</a>.</p>
    <table id="cart-table" hidden>
      <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th><span class="muted">Action</span></th></tr></thead>
      <tbody id="cart-body"></tbody>
    </table>
    <div id="cart-actions" hidden>
      <p class="total">Total: <span id="cart-total">$0.00</span></p>
      <a class="btn" href="checkout.html">Proceed to checkout</a>
    </div>
  </main>
  <footer class="site">&copy; 2026 ShopLite - a mock store for Synthetix testing</footer>
  <script src="js/app.js"></script>
</body>
</html>
