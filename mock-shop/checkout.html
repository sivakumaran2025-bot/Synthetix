<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - ShopLite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"><div class="bar">
    <a class="logo" href="index.html">ShopLite</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="login.html">Login</a></li>
    </ul></nav>
  </div></header>
  <main>
    <h1>Checkout</h1>
    <p class="muted">Order total: <strong id="checkout-total">$0.00</strong></p>
    <form class="stack" id="checkout-form">
      <label for="full-name">Full name <input type="text" id="full-name" name="full-name" required></label>
      <label for="email">Email <input type="email" id="email" name="email" required></label>
      <label for="address">Shipping address <input type="text" id="address" name="address" required></label>
      <label for="card">Card number <input type="text" id="card" name="card" inputmode="numeric" placeholder="4242 4242 4242 4242" required></label>
      <button class="btn" type="submit">Place order</button>
    </form>
  </main>
  <footer class="site">&copy; 2026 ShopLite - a mock store for Synthetix testing</footer>
  <script src="js/app.js"></script>
</body>
</html>
