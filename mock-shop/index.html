<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - ShopLite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"><div class="bar">
    <a class="logo" href="index.html">ShopLite</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="login.html">Login</a></li>
    </ul></nav>
  </div></header>
  <main>
    <section class="hero">
      <h1>Gear for everyday adventures</h1>
      <p class="lead">Discover bags, bottles, audio and lighting picked for people on the move.</p>
      <a class="btn" href="products.html">Shop now</a>
    </section>
    <section>
      <h2>Stay in the loop</h2>
      <form class="stack" id="newsletter-form" onsubmit="event.preventDefault(); document.getElementById('news-status').textContent='Thanks for subscribing!';">
        <label for="news-email">Email address
          <input type="email" id="news-email" name="news-email" placeholder="you@example.com" required>
        </label>
        <button class="btn" type="submit">Subscribe</button>
        <div id="news-status" role="status"></div>
      </form>
    </section>
  </main>
  <footer class="site">&copy; 2026 ShopLite - a mock store for Synthetix testing</footer>
  <script src="js/app.js"></script>
</body>
</html>
