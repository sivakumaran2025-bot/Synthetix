<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - ShopLite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site"><div class="bar">
    <a class="logo" href="index.html">ShopLite</a>
    <nav aria-label="Main"><ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="login.html">Login</a></li>
    </ul></nav>
  </div></header>
  <main>
    <h1>Sign in</h1>
    <form class="stack" id="login-form">
      <label for="login-email">Email <input type="email" id="login-email" name="login-email" required></label>
      <label for="login-password">Password <input type="password" id="login-password" name="login-password" required></label>
      <button class="btn" type="submit">Sign in</button>
      <div id="login-status" class="status-text" role="status"></div>
    </form>
  </main>
  <footer class="site">&copy; 2026 ShopLite - a mock store for Synthetix testing</footer>
  <script src="js/app.js"></script>
</body>
</html>
